<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主畫面 - 功能大廳</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="main.html">🌱 碳足跡主畫面大廳</a>
        <button onclick="handleLogout()" class="btn btn-outline-light">登出</button>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow-sm mb-3">
                <h5 class="fw-bold text-success mb-3">功能選單</h5>
                <div class="d-grid gap-3">
                    <a href="query_date.html" class="btn btn-outline-success py-3 fw-bold">📅 日期範圍查詢系統</a>
                    <a href="add_transport.html" class="btn btn-outline-success py-3 fw-bold">🚗 新增交通紀錄</a>
                    <a href="service.html" class="btn btn-outline-success py-3 fw-bold">💬 客服反饋系統</a>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="p-3 bg-white rounded shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold text-success m-0">📊 個人減碳數據分析</h5>
                    <select class="form-select form-select-sm w-auto" id="rangeSelect" onchange="changeData()">
                        <option value="d">每日分析</option>
                        <option value="w">每週分析</option>
                        <option value="m">每月分析</option>
                    </select>
                </div>
                <div style="height: 320px;"><canvas id="mainChart"></canvas></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://127.0.0.1:3000/api';
    let chart;
    let userId = localStorage.getItem('user_id');

    window.onload = function() {
        // 初始化 Chart.js
        const ctx = document.getElementById('mainChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: '碳排放 (kg)', 
                    data: [], 
                    backgroundColor: '#2e7d32' 
                }] 
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        changeData();
    };

    function getTodayString() {
        const today = new Date();
        const y = today.getFullYear();
        let m = String(today.getMonth() + 1).padStart(2, '0');
        let d = String(today.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    async function changeData() {
        const val = document.getElementById('rangeSelect').value;
        const todayStr = getTodayString();
        
        let endpoint = '';
        let labelKey = '';
        const labelsMap = { 'd': '每日碳排放 (kg)', 'w': '每週碳排放 (kg)', 'm': '每月碳排放 (kg)' };

        if (val === 'd') {
            endpoint = `/analysis/daily?user_id=${userId}&date=${todayStr}`;
            labelKey = 'date';
        } else if (val === 'w') {
            endpoint = `/analysis/weekly?user_id=${userId}&date=${todayStr}`;
            labelKey = 'week_label';
        } else if (val === 'm') {
            endpoint = `/analysis/monthly?user_id=${userId}&date=${todayStr}`;
            labelKey = 'month';
        }

        try {
            const response = await fetch(`${API_BASE}${endpoint}`);
            const result = await response.json(); 

            if (response.ok && result.status === 'success') {
                const labels = result.data.map(item => item[labelKey]);
                const emissions = result.data.map(item => item.total);

                chart.data.labels = labels;
                chart.data.datasets[0].data = emissions;
                chart.data.datasets[0].label = labelsMap[val];
                chart.update(); 
            }
        } catch (error) {
            console.error('Fetch Error:', error);
        }
    }

    async function handleLogout() {
        try {
            await fetch(`${API_BASE}/logout`, {
                method: 'POST',
                credentials: 'include'
            });
        } catch (error) {
            console.error("登出發生錯誤:", error);
        } finally {
            localStorage.removeItem('user_id');
            localStorage.removeItem('username');
            window.location.href = 'index.html'; // 登出後跳轉回登入頁
        }
    }
</script>
</body>
</html>
