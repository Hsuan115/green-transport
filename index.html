<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人交通碳足跡系統 - 登入/註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .auth-card { width: 100%; max-width: 420px; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); background-color: #ffffff; }
        .nav-pills .nav-link.active { background-color: #2e7d32; }
        .nav-link { color: #2e7d32; }
    </style>
</head>
<body>
<div class="auth-card">
    <h3 class="text-center text-success fw-bold mb-4">🌱 交通碳足跡系統</h3>
    <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
        <li class="nav-item"><button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-view" type="button">會員登入</button></li>
        <li class="nav-item"><button class="nav-link" id="reg-tab" data-bs-toggle="pill" data-bs-target="#reg-view" type="button">帳號註冊</button></li>
    </ul>
    <div class="tab-content">
        <div class="tab-pane fade show active" id="login-view">
            <form onsubmit="event.preventDefault(); window.location.href='main.html';">
                <div class="mb-3"><label class="form-label">使用者帳號</label><input type="text" id="loginUser" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">密碼</label><input type="password"  id="loginPwd" class="form-control" required></div>
                <button type="submit" class="btn btn-success w-100 py-2 mt-3">立即登入</button>
            </form>
        </div>
        <div class="tab-pane fade" id="reg-view">
            <form onsubmit="event.preventDefault(); alert('註冊成功！請登入。'); document.getElementById('login-tab').click();">
                <div class="mb-3"><label class="form-label">設定帳號</label><input type="text" id="regUser" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">密碼</label><input type="password" id="p1" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">確認密碼</label><input type="password" id="p2" class="form-control" required></div>
                <button type="submit" class="btn btn-outline-success w-100 py-2 mt-3">完成註冊</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    async function handleLogin(event) {
        event.preventDefault(); // 阻擋預設表單重整
        const user = document.getElementById('loginUser').value;
        const pwd = document.getElementById('loginPwd').value;

        try {
            // 串接登入 API (請依據您的後端路由調整)
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pwd })
            });

            if (response.ok) {
                window.location.href = 'main.html';
            } else {
                alert('帳號或密碼錯誤！');
            }
        } catch (error) {
            console.error('API Error:', error);
            // 無後端時的測試用跳轉
            window.location.href = 'main.html'; 
        }
    }

    async function handleRegister(event) {
        event.preventDefault();
        const user = document.getElementById('regUser').value;
        const p1 = document.getElementById('p1').value;
        const p2 = document.getElementById('p2').value;

        // 前端驗證：密碼是否一致
        if (p1 !== p2) {
            alert('兩次輸入的密碼不一致，請重新輸入！');
            return;
        }

        try {
            // 串接註冊 API
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: p1 })
            });
            
            alert('註冊成功！請登入。');
            document.getElementById('login-tab').click(); // 自動切換到登入頁籤
        } catch (error) {
            console.error('API Error:', error);
            alert('註冊成功！請登入。');
            document.getElementById('login-tab').click();
        }
    }
</script>
</body>
</html>
