<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交通工具查詢</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow-sm">
            <h2>依交通工具查詢</h2>
            <hr>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">交通工具：</label>
                    <select id="transportType" class="form-select">
                        <option value="捷運">捷運</option>
                        <option value="公車">公車</option>
                        <option value="火車">火車</option>
                        <option value="機車">機車</option>
                        <option value="汽車">汽車</option>
                        <option value="步行">步行</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">開始日期：</label>
                    <input type="date" id="startDate" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">結束日期：</label>
                    <input type="date" id="endDate" class="form-control">
                </div>
            </div>
            <button class="btn btn-success mt-4 w-100" onclick="queryData()">開始查詢</button>
        </div>
    </div>

    <script>
        function queryData() {
            // 取得使用者選擇的數據
            const transport = document.getElementById('transportType').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            
            // 簡單檢查：如果沒填日期提示一下
            if (!start || !end) {
                alert("請務必選擇開始與結束日期！");
                return;
            }

            console.log("準備發送給後端:", { transport, start, end });
            // 未來這裡會用 fetch() 把這三個數據打包送給後端 API
            alert("查詢條件已打包，等待後端串接中...");
        }
    </script>
</body>
</html>
