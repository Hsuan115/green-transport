<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交通工具與里程紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="mb-4"><a href="main.html" class="btn btn-success">⬅ 回主畫面</a></div>

    <div class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
        <h4 class="fw-bold text-success mb-3">🚗 輸入交通工具與里程</h4>
        <form onsubmit="event.preventDefault(); alert('紀錄成功送出！');">
            <div class="mb-3">
                <label class="form-label">交通工具種類</label>
                <select class="form-select" required>
                    <option value="">-- 請選擇 --</option>
                    <option value="1">步行 / 腳踏車</option>
                    <option value="2">機車 (Scooter)</option>
                    <option value="3">汽車 (Car)</option>
                    <option value="4">大眾運輸 (公車/捷運)</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">行駛里程數 (公里)</label>
                <input type="number" step="0.1" class="form-control" placeholder="請輸入公里數，例如：8.2" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mt-2">儲存至資料庫</button>
        </form>
    </div>
</div>

</body>
</html>
