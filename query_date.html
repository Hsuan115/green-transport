<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>日期與關鍵字查詢</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="mb-4"><a href="main.html" class="btn btn-secondary">⬅ 回主畫面</a></div>

    <div class="card p-4 shadow-sm">
        <h4 class="fw-bold mb-3">🔍 碳排紀錄查詢</h4>
        
        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <label class="form-label small text-muted">開始日期</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted">結束日期</label>
                <input type="date" id="endDate" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label small text-muted">關鍵字 (如：捷運、機車)</label>
                <input type="text" id="keyword" class="form-control" placeholder="輸入搜尋關鍵字...">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100" onclick="doQuery()">查詢</button>
            </div>
        </div>

        <table class="table table-hover mt-3" id="resultTable" style="display:none;">
            <thead class="table-light">
                <tr><th>日期</th><th>工具</th><th>km</th><th>碳排(kg)</th></tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
        <div id="noDataMsg" class="text-center text-muted mt-3" style="display:none;">無符合條件的查詢紀錄。</div>
    </div>
</div>

<script>
    const API_BASE = 'http://127.0.0.1:3000/api';

    async function doQuery() {
        const uid = localStorage.getItem('user_id');
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const keyword = document.getElementById('keyword').value;
        
        if (!uid) { alert("請先登入"); return; }
        
        // 組合查詢網址，加入 keyword 參數
        const url = `${API_BASE}/records?user_id=${uid}&start=${start}&end=${end}&keyword=${encodeURIComponent(keyword)}`;
        
        try {
            const res = await fetch(url);
            const result = await res.json();
            
            const tbody = document.getElementById('resultBody');
            const table = document.getElementById('resultTable');
            const noData = document.getElementById('noDataMsg');
            
            if (result.status === 'success' && result.records) {
                if (result.records.length > 0) {
                    table.style.display = 'table';
                    noData.style.display = 'none';
                    tbody.innerHTML = result.records.map(r => `
                        <tr>
                            <td>${r.usage_date}</td>
                            <td>${r.vehicle_name}</td>
                            <td>${r.distance_km}</td>
                            <td>${r.carbon_emission.toFixed(2)}</td>
                        </tr>
                    `).join('');
                } else {
                    table.style.display = 'none';
                    noData.style.display = 'block';
                }
            } else {
                alert("查詢失敗: " + (result.error || "未知錯誤"));
            }
        } catch (err) {
            console.error(err);
            alert("連線失敗，請確保後端服務已啟動。");
        }
    }
</script>
</body>
</html>
