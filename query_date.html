<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期範圍查詢</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="mb-4"><a href="main.html" class="btn btn-success">⬅ 回主畫面</a></div>

    <div class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
        <h4 class="fw-bold text-success mb-3">📅 日期範圍查詢</h4>
        <p class="text-muted small">系統已自動預設篩選範圍為【當月】</p>
        <div class="row g-3">
            <div class="col-6">
                <label class="form-label">開始日期</label>
                <input type="date" id="start" class="form-control">
            </div>
            <div class="col-6">
                <label class="form-label">結束日期</label>
                <input type="date" id="end" class="form-control">
            </div>
        </div>
        <button class="btn btn-primary w-100 mt-4" onclick="doQuery()">執行日期篩選查詢</button>
        <div id="res" class="mt-4"></div>
    </div>
</div>

<script>
    window.onload = function() {
        const today = new Date();
        const y = today.getFullYear();
        let m = String(today.getMonth() + 1).padStart(2, '0');
        let d = String(today.getDate()).padStart(2, '0');
        document.getElementById('start').value = `${y}-${m}-01`; // 當月1號
        document.getElementById('end').value = `${y}-${m}-${d}`;    // 今天
    };
    function doQuery() {
        const s = document.getElementById('start').value;
        const e = document.getElementById('end').value;
        document.getElementById('res').innerHTML = `<div class="alert alert-info">正在為您撈取自 ${s} 到 ${e} 的歷史排碳總資料...</div>`;
    }
</script>
</body>
</html>
