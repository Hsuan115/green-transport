<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期範圍查詢</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="mb-4"><a href="main.html" class="btn btn-success">⬅ 回主畫面</a></div>

    <div class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
        <h4 class="fw-bold text-success mb-3">📅 日期範圍查詢</h4>
        <p class="text-muted small">系統已自動預設篩選範圍為【當月】</p>
        <div class="row g-3">
            <div class="col-6">
                <label class="form-label">開始日期</label>
                <input type="date" id="start" class="form-control">
            </div>
            <div class="col-6">
                <label class="form-label">結束日期</label>
                <input type="date" id="end" class="form-control">
            </div>
        </div>
        <button class="btn btn-primary w-100 mt-4" onclick="doQuery()">執行日期篩選查詢</button>
        <div id="res" class="mt-4"></div>
    </div>
</div>

<script>
    window.onload = function() {
        const today = new Date();
        const y = today.getFullYear();
        let m = String(today.getMonth() + 1).padStart(2, '0');
        let d = String(today.getDate()).padStart(2, '0');
        document.getElementById('start').value = `${y}-${m}-01`; // 當月1號
        document.getElementById('end').value = `${y}-${m}-${d}`;    // 今天
    };
    async function doQuery() {
        const s = document.getElementById('start').value;
        const e = document.getElementById('end').value;
        const resDiv = document.getElementById('res');

        // 前端驗證
        if (!s || !e) {
            alert('請選擇完整的開始與結束日期！');
            return;
        }
        if (new Date(s) > new Date(e)) {
            alert('開始日期不能大於結束日期！');
            return;
        }

        resDiv.innerHTML = `<div class="alert alert-info">正在為您撈取自 ${s} 到 ${e} 的歷史排碳資料...</div>`;

        try {
            // 串接 API 取得 Traffic_Records 資料
            const response = await fetch(`/api/records/date-range?start=${s}&end=${e}`);
            const data = await response.json(); // 假設回傳格式包含 totalEmission 與 records 陣列
            
            // 顯示查詢結果與表格
            let html = `<div class="alert alert-success">查詢成功！該期間總碳排放量為：<strong>${data.totalEmission} kg</strong></div>`;
            html += `<table class="table table-bordered table-striped text-center">
                        <thead class="table-success">
                            <tr><th>日期</th><th>交通工具</th><th>里程(km)</th><th>碳排(kg)</th></tr>
                        </thead><tbody>`;
            
            if(data.records && data.records.length > 0) {
                data.records.forEach(r => {
                    html += `<tr><td>${r.usage_date}</td><td>${r.vehicle_name}</td><td>${r.distance_km}</td><td>${r.carbon_emission}</td></tr>`;
                });
            } else {
                html += `<tr><td colspan="4" class="text-muted">此區間查無資料</td></tr>`;
            }
            html += `</tbody></table>`;
            resDiv.innerHTML = html;

        } catch (error) {
            console.error('API Error:', error);
            resDiv.innerHTML = `<div class="alert alert-danger">資料載入失敗，或後端未啟動。</div>`;
        }
    }
</script>
</body>
</html>
