<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="mb-4"><a href="main.html" class="btn btn-success">⬅ 回主畫面</a></div>

    <div class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
        <h4 class="fw-bold text-dark mb-3">💬 客服意見回報系統</h4>
        <p class="text-muted small">使用過程中遇到任何問題嗎？歡迎填單回報給我們。</p>
        <form onsubmit="event.preventDefault(); alert('回報已收到，我們將盡快處理！'); window.location.href='main.html';">
            <div class="mb-3">
                <label class="form-label">您的問題反饋內容</label>
                <textarea id="feedbackContent" class="form-control" rows="5" placeholder="請詳細敘述您遇到的系統狀況..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">送出回報並回主畫面</button>
        </form>
    </div>
</div>

<script>
    async function submitFeedback(event) {
        event.preventDefault();
        const content = document.getElementById('feedbackContent').value;

        try {
            // 寫入資料庫 Feedback_Forms
            const response = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_content: content })
            });
            
            alert('回報已收到，我們將盡快處理！');
            window.location.href = 'main.html';
        } catch (error) {
            alert('回報已收到，我們將盡快處理！');
            window.location.href = 'main.html';
        }
    }
</script>

</body>
</html>
