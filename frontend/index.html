<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人交通碳足跡系統 - 登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); min-height: 100vh; }
        .auth-card { max-width: 420px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); background-color: #ffffff; }
    </style>
</head>
<body>
    <div class="auth-card mt-5">
        <h3 class="text-center text-success fw-bold mb-4">🌱 交通碳足跡系統</h3>
        
        <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login-view">會員登入</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#reg-view">帳號註冊</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#forgot-view">忘記密碼</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="login-view">
                <div id="login-form-area">
                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3"><label class="form-label">使用者帳號</label><input type="text" id="loginUser" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">密碼</label><input type="password" id="loginPwd" class="form-control" required></div>
                        <button type="submit" class="btn btn-success w-100">立即登入</button>
                    </form>
                </div>
            </div>

            <div class="tab-pane fade" id="reg-view">
                <form onsubmit="handleRegister(event)">
                    <div class="mb-3"><label class="form-label">設定帳號</label><input type="text" id="regUser" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">密碼</label><input type="password" id="p1" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">確認密碼</label><input type="password" id="p2" class="form-control" required></div>
                    <button type="submit" class="btn btn-outline-success w-100">完成註冊</button>
                </form>
            </div>

            <div class="tab-pane fade" id="forgot-view">
                <form onsubmit="handleResetPassword(event)">
                    <div class="mb-3">
                        <label class="form-label">使用者帳號</label>
                        <input type="text" id="resetUser" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密碼</label>
                        <input type="password" id="resetPwd1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">確認新密碼</label>
                        <input type="password" id="resetPwd2" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 text-dark fw-bold">重設密碼</button>
                </form>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = 'http://127.0.0.1:3000/api';

    window.onload = async function() {
        try {
            const response = await fetch(`${API_BASE}/me`, {
                method: 'GET',
                credentials: 'include'
            });
            const result = await response.json();
            
            if (result.success) {
                // 確保 localStorage 有值
                localStorage.setItem('user_id', result.user.id);
                localStorage.setItem('username', result.user.name);

                const loginFormArea = document.getElementById('login-form-area');
                loginFormArea.innerHTML = `
                    <div class="text-center p-3">
                        <p class="text-success">您已登入為: <b>${result.user.name}</b></p>
                        <a href="main.html" class="btn btn-success w-100 mb-2">進入主畫面</a>
                        <button onclick="handleLogoutAndRefresh()" class="btn btn-link text-muted btn-sm">登出並重新登入</button>
                    </div>
                `;
            }
        } catch (err) {
            console.log("尚未登入");
        }
    };

    async function handleLogoutAndRefresh() {
        await fetch(`${API_BASE}/logout`, { method: 'POST', credentials: 'include' });
        localStorage.removeItem('user_id');
        localStorage.removeItem('username');
        window.location.reload();
    }

    async function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('loginUser').value;
        const pwd = document.getElementById('loginPwd').value;

        try {
            const response = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ username: user, password: pwd })
            });
            const result = await response.json();
            
            if (result.success) {
                // 直接使用登入 API 回傳的 user 資料，不再呼叫 /me，完美避開瀏覽器快取問題！
                localStorage.setItem('user_id', result.user.id);
                localStorage.setItem('username', result.user.name);
                
                window.location.href = 'main.html';
            } else {
                alert("登入失敗：" + result.message);
            }
        } catch (err) {
            alert("無法連線至後端");
        }
    }

    
    async function handleRegister(e) {
        e.preventDefault();
        const user = document.getElementById('regUser').value;
        const p1 = document.getElementById('p1').value;
        const p2 = document.getElementById('p2').value;

        if (p1 !== p2) { alert("兩次密碼不一致！"); return; }

        try {
            const response = await fetch(`${API_BASE}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ username: user, password: p1 })
            });
            const result = await response.json();
            if (result.success) {
                alert("註冊成功！");
                document.querySelector('[data-bs-target="#login-view"]').click();
            } else {
                alert("註冊失敗：" + result.message);
            }
        } catch (err) { alert("連線錯誤"); }
    }


    async function handleResetPassword(e) {
        e.preventDefault();
        const user = document.getElementById('resetUser').value;
        const p1 = document.getElementById('resetPwd1').value;
        const p2 = document.getElementById('resetPwd2').value;

        if (p1 !== p2) { 
            alert("兩次新密碼不一致！"); 
            return; 
        }

        try {
            const response = await fetch(`${API_BASE}/reset_password`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ username: user, new_password: p1 })
            });
            const result = await response.json();
            
            if (result.success) {
                alert("密碼重設成功！請使用新密碼重新登入。");
                // 清空輸入框
                document.getElementById('resetUser').value = '';
                document.getElementById('resetPwd1').value = '';
                document.getElementById('resetPwd2').value = '';
                // 自動切換回登入分頁
                document.querySelector('[data-bs-target="#login-view"]').click();
            } else {
                alert("重設失敗：" + result.message);
            }
        } catch (err) { 
            alert("連線錯誤"); 
        }
    }
</script>
</body>
</html>
