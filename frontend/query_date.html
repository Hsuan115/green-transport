<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期範圍查詢</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="mb-4"><a href="main.html" class="btn btn-success">⬅ 回主畫面</a></div>

    <div class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
        <h4 class="fw-bold text-dark mb-4">📅 日期範圍查詢</h4>
        
        <div class="row g-2 mb-3">
            <div class="col">
                <label class="form-label small text-muted">開始日期</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            <div class="col">
                <label class="form-label small text-muted">結束日期</label>
                <input type="date" id="endDate" class="form-control">
            </div>
        </div>
        
        <button class="btn btn-primary w-100 mb-4" onclick="doQuery()">開始查詢</button>
        
        <table class="table table-bordered table-hover text-center" id="resultTable" style="display:none;">
            <thead class="table-success">
                <tr>
                    <th>日期</th>
                    <th>交通工具</th>
                    <th>距離 (km)</th>
                    <th>碳排放 (kg)</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <!-- 資料將動態插入此處 -->
            </tbody>
        </table>
        
        <div id="noDataMsg" class="text-center text-muted" style="display:none;">
            查無資料
        </div>
    </div>
</div>

<script>
    // 統一後端 API 網址
    const API_BASE = 'http://127.0.0.1:3000/api';
    const userId = localStorage.getItem('user_id');

    async function doQuery() {
        
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        
        if(!start || !end) {
            alert("請選擇完整日期範圍！");
            return;
        }
        try {
            // 使用實際登入的 userId 進行查詢，不再寫死 user_id=1
            const response = await fetch(`${API_BASE}/records?user_id=${userId}&start=${start}&end=${end}`);
            const result = await response.json();
            
            const table = document.getElementById('resultTable');
            const tbody = document.getElementById('resultBody');
            const noData = document.getElementById('noDataMsg');
            
            if (response.ok && result.status === 'success') {
                if (result.data.length === 0) {
                    // 如果沒有資料，隱藏表格並顯示提示訊息
                    table.style.display = 'none';
                    noData.style.display = 'block';
                } else {
                    // 如果有資料，顯示表格並清空舊資料
                    noData.style.display = 'none';
                    table.style.display = 'table';
                    tbody.innerHTML = ''; 
                    
                    // 將後端回傳的資料一行一行加入表格
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        // 處理日期格式 (可選：如果後端傳來包含時間，這裡可以將其截斷只顯示日期)
                        const displayDate = item.usage_date.split(' ')[0]; 
                        
                        tr.innerHTML = `
                            <td>${displayDate}</td>
                            <td>${item.vehicle_name}</td>
                            <td>${item.distance_km}</td>
                            <td>${item.carbon_emission}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } else {
                alert("查詢失敗：" + (result.error || "未知錯誤"));
            }
        } catch (error) {
            alert("無法連線至後端！請確保後端 app.py 有啟動喔！");
            console.error(error);
        }
    }
</script>
</body>
</html>
