<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主畫面 - 功能大廳</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="main.html">🌱 碳足跡主畫面大廳</a>
        <a href="login.html" class="btn btn-outline-light btn-sm">登出</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow-sm mb-3">
                <h5 class="fw-bold text-success mb-3">功能選單</h5>
                <div class="d-grid gap-3">
                    <a href="query_date.html" class="btn btn-outline-success py-3 fw-bold">📅 日期範圍查詢系統</a>
                    <a href="add_transport.html" class="btn btn-outline-success py-3 fw-bold">🚗 新增交通紀錄</a>
                    <a href="service.html" class="btn btn-outline-secondary py-3 fw-bold">💬 客服反饋系統</a>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="p-3 bg-white rounded shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold text-success m-0">📊 個人減碳數據分析</h5>
                    <select class="form-select form-select-sm w-auto" id="rangeSelect" onchange="changeData()">
                        <option value="d">每日分析</option>
                        <option value="w">每週分析</option>
                        <option value="m">每月分析</option>
                    </select>
                </div>
                <div style="height: 320px;"><canvas id="mainChart"></canvas></div>
            </div>
        </div>
    </div>
</div>

<script>
    let chart;
    window.onload = function() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: [], // 留空 動態填入日期
                datasets: [{ 
                    label: '碳排放 (kg)', 
                    data: [], // 留空，動態填入碳排放數字
                    backgroundColor: '#2e7d32' 
                }] 
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        changeData();
    };

    // 負責切換每日、每週、每月的函數
    async function changeData() {
        const val = document.getElementById('rangeSelect').value;

        try {
            // 串接 API，將時間維度參數送給後端
            const response = await fetch(`/api/chart-data?range=${val}`);
            const data = await response.json(); // 預期回傳 { labels: [...], emissions: [...] }

            // 更新 Chart.js 資料
            chart.data.labels = data.labels;
            chart.data.datasets[0].data = data.emissions;
            
            // 依據時間動態改變圖例名稱
            const labelsMap = { 'd': '每日碳排放 (kg)', 'w': '每週碳排放 (kg)', 'm': '每月碳排放 (kg)' };
            chart.data.datasets[0].label = labelsMap[val];

            chart.update(); // 重繪圖表
        } catch (error) {
            console.error('API Error:', error);
            
            // ⚠️ 在尚未建置後端 API 時的模擬(Mock)備用數據顯示
            const mockData = {
                'd': { labels: ['週一', '週二', '週三', '週四', '週五'], emissions: [1.2, 0.5, 2.3, 0.8, 3.1] },
                'w': { labels: ['第1週', '第2週', '第3週', '第4週'], emissions: [15.5, 12.0, 18.2, 10.4] },
                'm': { labels: ['一月', '二月', '三月', '四月', '五月'], emissions: [45.2, 50.1, 42.0, 38.5, 40.0] }
            };
            chart.data.labels = mockData[val].labels;
            chart.data.datasets[0].data = mockData[val].emissions;
            chart.update();
        }
        
    }
</script>
</body>
</html>
