<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>個人交通碳足跡系統 - 登入/註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 420px; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); background-color: #ffffff; }
    </style>
</head>
<body>
<div class="auth-card">
    <h3 class="text-center text-success fw-bold mb-4">🌱 交通碳足跡系統</h3>
    <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login-view">會員登入</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#reg-view">帳號註冊</button></li>
    </ul>
    <div class="tab-content">
        <div class="tab-pane fade show active" id="login-view">
            <form onsubmit="handleLogin(event)">
                <div class="mb-3"><label class="form-label">帳號</label><input type="text" id="loginUser" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">密碼</label><input type="password" id="loginPwd" class="form-control" required></div>
                <button type="submit" class="btn btn-success w-100">立即登入</button>
            </form>
        </div>
        <div class="tab-pane fade" id="reg-view">
            <form onsubmit="handleRegister(event)">
                <div class="mb-3"><label class="form-label">設定帳號</label><input type="text" id="regUser" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">密碼</label><input type="password" id="p1" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">確認密碼</label><input type="password" id="p2" class="form-control" required></div>
                <button type="submit" class="btn btn-outline-success w-100">完成註冊</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function handleLogin(e) { e.preventDefault(); window.location.href='main.html'; }
    async function handleRegister(e) { e.preventDefault(); alert('註冊成功！'); location.reload(); }
</script>
</body>
</html>
