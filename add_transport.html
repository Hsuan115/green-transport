<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>新增碳排紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow-sm" style="max-width: 500px; margin: auto;">
            <h2 class="mb-4">➕ 新增碳排紀錄</h2>
            
            <div class="mb-3">
                <label class="form-label">選擇日期：</label>
                <input type="date" id="recordDate" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">交通工具：</label>
                <select id="transportType" class="form-select">
                    <option value="捷運">捷運</option>
                    <option value="公車">公車</option>
                    <option value="火車">火車</option>
                    <option value="機車">機車</option>
                    <option value="汽車">汽車</option>
                    <option value="步行">步行</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">行駛公里數 (km)：</label>
                <input type="number" id="distance" class="form-control" placeholder="請輸入數值">
            </div>

            <button class="btn btn-success w-100" onclick="submitRecord()">儲存紀錄</button>
        </div>
    </div>

    <script>
        function submitRecord() {
            const recordDate = document.getElementById('recordDate').value;
            const transport = document.getElementById('transportType').value;
            const distance = document.getElementById('distance').value;

            if (!recordDate || !distance) {
                alert("請務必填寫日期與公里數！");
                return;
            }

            // 這邊就是後端要接收的資料格式
            console.log("送出紀錄:", { recordDate, transport, distance });
            alert("紀錄已儲存！");
        }
    </script>
</body>
</html>
