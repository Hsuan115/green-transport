<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>新增紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card p-4 shadow-sm">
            <h2 class="mb-4">➕ 新增碳排紀錄</h2>
            <input type="date" id="recordDate" class="form-control mb-3">
            <select id="transportType" class="form-select mb-3">
                <option value="捷運">捷運</option><option value="公車">公車</option><option value="機車">機車</option>
                <option value="汽車">汽車</option><option value="步行">步行</option><option value="火車">火車</option>
            </select>
            <input type="number" id="distance" class="form-control mb-3" placeholder="行駛公里數 (km)">
            <button class="btn btn-success w-100" onclick="alert('紀錄已儲存')">儲存紀錄</button>
            <a href="main.html" class="btn btn-link w-100 mt-2">返回主頁</a>
        </div>
    </div>
</body>
</html>
